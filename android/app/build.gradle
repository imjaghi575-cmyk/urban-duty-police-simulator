plugins {
    id 'com.android.application'
}

android {
    namespace 'com.urbanduty.game'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'com.urbanduty.game'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DURBANDUTY_BUILD_TESTS=OFF', '-DURBANDUTY_FETCH_SDL=ON', '-DURBANDUTY_ENABLE_VULKAN=ON'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
