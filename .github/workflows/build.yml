name: Urban Duty Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux/Vulkan development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libwayland-egl1 libxkbcommon-dev libdecor-0-dev
      - name: Configure
        run: cmake -S . -B build -DURBANDUTY_BUILD_TESTS=ON -DURBANDUTY_FETCH_SDL=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DURBANDUTY_BUILD_TESTS=ON -DURBANDUTY_FETCH_SDL=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build/Release/UrbanDuty.exe artifacts/UrbanDuty-Windows.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: urban-duty-windows
          path: artifacts/UrbanDuty-Windows.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Prepare SDL Android Java glue
        run: |
          git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git .ci-sdl
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp .ci-sdl/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/
      - name: Configure native Android build
        run: |
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DURBANDUTY_BUILD_TESTS=OFF \
            -DURBANDUTY_FETCH_SDL=ON
      - name: Build native library
        run: cmake --build build-android --parallel
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK contents
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libmain.so|AndroidManifest.xml'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urban-duty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
