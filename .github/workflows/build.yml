name: Urban Duty Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux/Vulkan development files
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libwayland-egl1 libxkbcommon-dev libdecor-0-dev
      - name: Configure
        run: cmake -S . -B build -DURBANDUTY_BUILD_TESTS=ON -DURBANDUTY_FETCH_SDL=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DURBANDUTY_BUILD_TESTS=ON -DURBANDUTY_FETCH_SDL=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build/Release/UrbanDuty.exe artifacts/UrbanDuty-Windows.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: urban-duty-windows
          path: artifacts/UrbanDuty-Windows.exe
          if-no-files-found: error

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Configure native Android build
        run: |
          set -euxo pipefail
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DURBANDUTY_BUILD_TESTS=OFF \
            -DURBANDUTY_FETCH_SDL=ON \
            -DURBANDUTY_ENABLE_VULKAN=ON
      - name: Inspect native targets
        run: |
          set -euxo pipefail
          cmake --build build-android --target help | tee android-native-targets.txt
          grep -E 'UrbanDuty$|UrbanDutyCore$|UrbanDutyVulkan$' android-native-targets.txt || true
      - name: Build native library
        run: cmake --build build-android --target UrbanDuty --parallel --verbose 2>&1 | tee android-native-build.log
      - name: Verify native library
        shell: bash
        run: |
          set -euo pipefail
          native_lib="$(find build-android -type f -name 'libmain.so' -size +0c -print -quit)"
          test -n "$native_lib"
          echo "Native library: $native_lib"
          file "$native_lib"
          readelf -h "$native_lib" | tee android-native-elf.txt
          grep -q 'AArch64' android-native-elf.txt
      - name: Upload Android native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-duty-android-native-diagnostics
          path: |
            android-native-build.log
            android-native-targets.txt
            android-native-elf.txt
            build-android/CMakeCache.txt
          if-no-files-found: warn

  android-apk:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Prepare SDL Android Java glue
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch release-3.4.12 https://github.com/libsdl-org/SDL.git .ci-sdl
          mkdir -p android/app/src/main/java/org/libsdl/app
          cp .ci-sdl/android-project/app/src/main/java/org/libsdl/app/*.java android/app/src/main/java/org/libsdl/app/
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee ../android-apk-build.log
      - name: Verify APK contents and native ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | tee android-apk-contents.txt
          grep -q 'lib/arm64-v8a/libmain.so' android-apk-contents.txt
          grep -q 'AndroidManifest.xml' android-apk-contents.txt
          unzip -p "$apk" lib/arm64-v8a/libmain.so > apk-libmain.so
          file apk-libmain.so
          readelf -h apk-libmain.so | tee android-apk-elf.txt
          grep -q 'AArch64' android-apk-elf.txt
          echo "APK verified: $apk"
      - name: Upload APK diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban-duty-android-apk-diagnostics
          path: |
            android-apk-build.log
            android-apk-contents.txt
            android-apk-elf.txt
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: urban-duty-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
